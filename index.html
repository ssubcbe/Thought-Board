<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thought Board</title>
  <meta name="theme-color" content="#F5F4EF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E5E4E'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='11' height='3' rx='1.5' fill='white' opacity='.75'/%3E%3Crect x='8' y='21' width='7' height='3' rx='1.5' fill='white' opacity='.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Sign in (online mode only) ── -->
  <div id="auth" class="auth" hidden>
    <form id="loginForm" class="auth-card">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span class="app-name">Thought Board</span></div>
      <h1>Sign in</h1>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginErr" class="err" hidden></p>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>

  <!-- ── App ── -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span class="app-name">Thought Board</span></div>
      <input id="q" class="search" type="search" placeholder="Search thoughts & projects" aria-label="Search">
      <div class="top-actions">
        <button id="newBtn" class="btn primary" type="button"><span aria-hidden="true">＋</span> New thought</button>
        <div class="menu-wrap">
          <button id="menuBtn" class="btn ghost icon-btn" type="button" aria-label="More" aria-haspopup="true">⋯</button>
          <div id="menu" class="menu" hidden>
            <button type="button" data-menu="export">Export backup (JSON)</button>
            <button type="button" data-menu="import">Import backup…</button>
            <button type="button" data-menu="signout" id="signoutItem">Sign out</button>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </header>

    <section id="summary" class="summary" aria-label="Summary"></section>

    <nav class="toolbar" aria-label="Views">
      <div class="seg" id="viewSeg">
        <button type="button" data-view="board">Board</button>
        <button type="button" data-view="list">List</button>
      </div>
      <div class="seg" id="boardSeg">
        <button type="button" data-board="pipeline">Pipeline</button>
        <button type="button" data-board="decision">Decisions</button>
        <button type="button" data-board="status">Projects · Status</button>
        <button type="button" data-board="priority">Projects · Priority</button>
      </div>
      <div class="seg" id="filterSeg">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="thoughts">Thoughts</button>
        <button type="button" data-filter="projects">Projects</button>
      </div>
      <span id="modeNote" class="mode-note"></span>
    </nav>

    <main id="main"></main>
  </div>

  <!-- ── Editor drawer ── -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <form id="form" novalidate>
      <header class="drawer-head">
        <div>
          <span id="typeBadge" class="chip">Thought</span>
          <h2 id="drawerTitle">New thought</h2>
        </div>
        <button type="button" class="btn ghost icon-btn" data-close aria-label="Close">✕</button>
      </header>

      <div class="drawer-body">
        <div class="icon-row">
          <div id="iconPreview" class="icon-slot"></div>
          <label class="field grow"><span>Icon <em>emoji or square image URL</em></span>
            <input name="icon" placeholder="e.g. 🌱 or https://…/icon.png" maxlength="500"></label>
        </div>

        <label class="field"><span>Title</span>
          <input name="title" required maxlength="120" placeholder="What's the thought?"></label>

        <div class="grid-2">
          <label class="field"><span>Stage</span>
            <select name="stage">
              <option value="initial">Initial</option>
              <option value="data_gathering">Data Gathering</option>
              <option value="review">Review</option>
              <option value="decision">Decision</option>
            </select></label>
          <label class="field" id="decisionField"><span>Decision</span>
            <select name="decision">
              <option value="">Awaiting decision</option>
              <option value="proceed">Proceed</option>
              <option value="dropped">Dropped</option>
              <option value="future">For Future Consideration</option>
              <option value="on_hold">On-Hold</option>
            </select></label>
        </div>

        <fieldset id="projectBox" class="project-box">
          <legend>Project</legend>
          <p id="projectHint" class="hint">Priority and Status become active once the Decision is <b>Proceed</b>.</p>
          <div class="grid-2">
            <label class="field"><span>Priority</span>
              <select name="priority">
                <option value="">—</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select></label>
            <label class="field"><span>Status</span>
              <select name="status">
                <option value="">—</option>
                <option value="not_started">Not Started</option>
                <option value="wip">WIP</option>
                <option value="completed">Completed</option>
                <option value="on_hold">On-Hold</option>
              </select></label>
          </div>
        </fieldset>

        <div class="grid-3">
          <label class="field"><span>Start date</span><input name="start_date" type="date"></label>
          <label class="field"><span>Duration (weeks)</span><input name="duration_weeks" type="number" min="0" max="520" step="1" inputmode="numeric"></label>
          <label class="field"><span>End date <em>calculated</em></span><input name="end_date" readonly tabindex="-1" class="calc"></label>
        </div>

        <label class="field"><span>Description <small class="counter" data-for="description"></small></span>
          <textarea name="description" rows="4" placeholder="What is it about?"></textarea></label>

        <label class="field"><span>Objective <small class="counter" data-for="objective"></small></span>
          <textarea name="objective" rows="3" placeholder="What should it achieve?"></textarea></label>

        <label class="field"><span>Expected benefit</span>
          <textarea name="expected_benefit" rows="3" placeholder="Why is it worth doing?"></textarea></label>

        <div class="grid-2">
          <label class="field"><span>Planned cost <em id="currencyNote"></em></span>
            <input name="planned_cost" type="number" min="0" step="1" inputmode="decimal"></label>
          <label class="field"><span>Development link</span>
            <input name="dev_link" type="url" placeholder="Notion, Drive, Trello, GitHub…" maxlength="1000"></label>
        </div>
      </div>

      <footer class="drawer-foot">
        <button type="button" id="deleteBtn" class="btn danger-ghost">Delete</button>
        <button type="button" id="shareFromForm" class="btn ghost">Share</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </aside>

  <!-- ── Dialogs ── -->
  <dialog id="shareDlg" class="dlg">
    <form method="dialog">
      <header class="dlg-head"><h2>Share</h2><button class="btn ghost icon-btn" value="close" aria-label="Close">✕</button></header>
      <div id="shareBody" class="dlg-body"></div>
    </form>
  </dialog>

  <dialog id="confirmDlg" class="dlg small">
    <form method="dialog">
      <div class="dlg-body"><p id="confirmMsg"></p></div>
      <footer class="dlg-foot">
        <button class="btn ghost" value="no">Cancel</button>
        <button class="btn danger" value="yes">Delete</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
